name: Codex Paper CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-build-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"

      - name: Pin npm
        run: npm install --global npm@10.9.8 --ignore-scripts

      - name: Secret scan
        run: bash scripts/codex-paper.sh secret-scan

      - name: Supply-chain policy
        run: bash scripts/codex-paper.sh supply-chain-test

      - name: Repository Contract
        run: bash scripts/codex-paper.sh repo-check

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"

      - name: Harden Python bootstrap source
        run: |
          python_stdlib="$(python -I -B -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')"
          sudo chmod go-w "$pythonLocation" "$python_stdlib"

      - name: Install dependencies
        env:
          CODEX_PAPER_BOOTSTRAP_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: bash scripts/codex-paper.sh install

      - name: Verify lockfiles remain reviewed after install
        run: bash scripts/codex-paper.sh supply-chain-test

      - name: Runtime baseline
        run: bash scripts/codex-paper.sh runtime-status

      - name: Dependency audit
        run: bash scripts/codex-paper.sh dependency-audit

      - name: Unit tests
        run: bash scripts/codex-paper.sh test

      - name: PDF ingestion security
        run: bash scripts/codex-paper.sh pdf-security-test

      - name: Generated-code sandbox setup and conformance
        run: |
          bash scripts/codex-paper.sh sandbox-setup
          bash scripts/codex-paper.sh sandbox-test
          bash scripts/codex-paper.sh sandbox-status

      - name: Paper Identity 1.0 and 2.0
        run: bash scripts/codex-paper.sh identity-test

      - name: Paper Library Layout 1.0
        run: bash scripts/codex-paper.sh layout-test

      - name: Generation Workspace and Storage Transactions
        run: bash scripts/codex-paper.sh storage-test

      - name: Generation Publication and Recovery
        run: bash scripts/codex-paper.sh publication-test

      - name: Unified Provenance and Generation Manifest 2.0
        run: bash scripts/codex-paper.sh provenance-test

      - name: Compatibility, Doctor, Backup, and Restore
        run: bash scripts/codex-paper.sh migration-test

      - name: Validation Report 1.0
        run: bash scripts/codex-paper.sh validation-test

      - name: Mandatory deterministic PDF regression
        run: bash scripts/codex-paper.sh benchmark-mandatory

      - name: Optional external parser corpus
        env:
          CODEX_PAPER_ALLOW_MISSING_BENCHMARK_PDFS: "1"
        run: bash scripts/codex-paper.sh benchmark

      - name: Reasoning and package benchmarks
        run: |
          bash scripts/codex-paper.sh reasoning-test
          bash scripts/codex-paper.sh package-test

      - name: Production build
        run: bash scripts/codex-paper.sh build

      - name: Viewer security integration
        run: bash scripts/codex-paper.sh security-test

      - name: Smoke test
        run: bash scripts/codex-paper.sh smoke-test
