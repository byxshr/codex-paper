name: Codex Paper CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-build-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Repository Contract
        run: bash scripts/codex-paper.sh repo-check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: bash scripts/codex-paper.sh install

      - name: Unit tests
        run: bash scripts/codex-paper.sh test

      - name: PDF ingestion security
        run: bash scripts/codex-paper.sh pdf-security-test

      - name: Generated-code sandbox setup and conformance
        run: |
          bash scripts/codex-paper.sh sandbox-setup
          bash scripts/codex-paper.sh sandbox-test
          bash scripts/codex-paper.sh sandbox-status

      - name: Paper Identity 1.0
        run: bash scripts/codex-paper.sh identity-test

      - name: Validation Report 1.0
        run: bash scripts/codex-paper.sh validation-test

      - name: Mandatory deterministic PDF regression
        run: bash scripts/codex-paper.sh benchmark-mandatory

      - name: Optional external parser corpus
        env:
          CODEX_PAPER_ALLOW_MISSING_BENCHMARK_PDFS: "1"
        run: bash scripts/codex-paper.sh benchmark

      - name: Reasoning and package benchmarks
        run: |
          bash scripts/codex-paper.sh reasoning-test
          bash scripts/codex-paper.sh package-test

      - name: Production build
        run: bash scripts/codex-paper.sh build

      - name: Viewer security integration
        run: bash scripts/codex-paper.sh security-test

      - name: Smoke test
        run: bash scripts/codex-paper.sh smoke-test
